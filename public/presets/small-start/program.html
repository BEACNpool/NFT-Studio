<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data:;connect-src 'none';form-action 'none';base-uri 'none'"><title>Small Start</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101314;color:#f1f2ed;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);text-align:center;--a:#8ee8e1}header{letter-spacing:.18em;font-size:11px;color:var(--a)}h1{font-size:clamp(24px,6vw,36px);line-height:1.15;overflow-wrap:anywhere;margin:18px 0 28px}button,summary{font:inherit;cursor:pointer}button{border:1px solid #46514a;background:transparent;color:inherit;border-radius:30px;min-height:48px;padding:10px 24px}button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:4px}.modes,.actions{display:flex;justify-content:center;gap:8px}.modes button{font-size:14px;min-height:44px;padding:8px 22px}.modes [aria-pressed=true],.primary{background:var(--a);border-color:var(--a);color:#101314}.orb{width:240px;height:240px;margin:28px auto;border:1px solid var(--a);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 10px #ffffff04,0 0 0 30px #ffffff02}.orb span{font-size:54px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.deck{border-radius:32px;transform:rotate(-3deg);padding:24px}.deck span{font-size:28px;line-height:1.15;letter-spacing:-.02em;transform:rotate(3deg);overflow-wrap:anywhere;max-width:100%}#status{color:#c8cdc5;font-size:14px;min-height:42px;margin:0 0 12px}details{margin:24px 0;text-align:left;font-size:14px}summary{color:var(--a)}li{padding:4px;overflow-wrap:anywhere}footer{color:#a7afa7;font-size:11px;margin-top:30px}footer p{margin:5px 0}@media(max-width:340px){body{padding:16px}.orb{width:220px;height:220px}}</style></head><body><main><header>BMKR / FOCUS CAPSULE</header><h1>Small Start</h1><div class="modes"><button id="focus" aria-pressed="true">Focus</button><button id="break" aria-pressed="false">Break</button></div><div class="orb"><span id="clock" role="timer">00:00</span></div><p id="status" role="status">One thing at a time.</p><div class="actions"><button id="start" class="primary">Start</button><button id="reset">Reset</button></div><footer><p>PUBLIC · REUSABLE · RUNS OFFLINE</p><p>Keep this page open. Device suspension may delay the display.</p><p>Session resets on reload. No wallet or network access.</p></footer></main><script>'use strict';const C={"version":1,"kind":"focus","work":10,"rest":2,"accent":"#8ee8e1"},$=id=>document.getElementById(id);let mode='work',left=C.work*60,running=false,deadline=0;const clock=$('clock'),start=$('start'),status=$('status');function draw(){if(running){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){running=false;start.textContent='Start again';status.textContent=mode==='work'?'Focus complete. Take a break.':'Break complete. Ready when you are.'}}clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function reset(){running=false;left=C[mode]*60;start.textContent='Start';status.textContent=mode==='work'?'One thing at a time.':'Give yourself a little space.';draw()}start.onclick=()=>{if(running){draw();running=false;start.textContent='Resume';status.textContent='Paused.'}else{if(!left)left=C[mode]*60;deadline=Date.now()+left*1000;running=true;start.textContent='Pause';status.textContent=mode==='work'?'Your time. Your attention.':'Rest is part of the work.'}draw()};$('reset').onclick=reset;for(const [id,value] of [['focus','work'],['break','rest']])$(id).onclick=()=>{mode=value;for(const key of ['focus','break'])$(key).setAttribute('aria-pressed',String(key===id));reset()};setInterval(draw,200);document.addEventListener('visibilitychange',draw);draw();</script></body></html>
