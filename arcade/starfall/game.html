<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://pool.pm; base-uri 'none'; form-action 'none'"><title>STARFALL</title><style>body{margin:0;background:#070b15;color:#f4eddf;font:16px/1.5 system-ui;padding:24px}main{max-width:560px;margin:12vh auto}h1{letter-spacing:.2em;font-size:36px}p{color:#bdc5d1}button,input{font:inherit;color:inherit;background:#1a2434;border:1px solid #778398;border-radius:8px;padding:12px;margin:8px 8px 8px 0;max-width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f4c882;outline-offset:3px}b{color:#f4c882}small{display:block;color:#bdc5d1}#files{display:block}</style><main><b>CARRY THE LAST SUN</b><h1>STARFALL</h1><p id="status" role="status" aria-live="polite">Reading the on-chain cartridge…</p><button id="retry">Retry connection</button><label for="files">Or open both saved cartridge files</label><input id="files" type="file" accept=".sfpart,application/json" multiple><small>The game is stored in two companion NFTs on Cardano. This reader uses pool.pm to retrieve them and checks every byte before running. Saved cartridge files also work offline in a modern browser.</small></main><script>
(()=>{
const manifest={"format":"starfall-cartridge-v1","gzipBytes":17107,"gzipSHA256":"1bb852d30ff4e3abeb17049be55dbb0b586709058c918ac03ef50e56830286b0","expandedBytes":42600,"expandedSHA256":"a339a49b4c926ab4bd2fa891c5141f371ecc11f7ca0d8771647419872aef4f3a","parts":[{"part":0,"bytes":8554,"sha256":"75981356c101f9965e4f836ed7631685402f7f80ab3e363739dadc4459106e84","fingerprint":"asset1htf5f6el4vcpfthztt3j5qll7kj448jwn5t6e3","policy":"8de58044b3526248c14081a4305eb83c5f061fdc80ed41cfe66b10be"},{"part":1,"bytes":8553,"sha256":"2abbca40d3387bcb8dbf5abfff6da8dc77579fd54e31bb205260ed56699d0937","fingerprint":"asset187tt6cecvag9694cqhqmtjg88thulkysl0hl8t","policy":"0d854956d5b7106815eff367d512d1eb392d08335ac16d648c87194f"}]},status=document.getElementById('status');let busy=false;
const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),v=>v.toString(16).padStart(2,'0')).join('');
async function assemble(parts){
 const bytes=[];for(let i=0;i<2;i++){
  const p=parts.find(x=>x.part===i),m=manifest.parts[i];
  if(!p||p.data.length>20000||!/^[A-Za-z0-9+/]+={0,2}$/.test(p.data))throw Error('A cartridge file is missing or malformed.');
  const b=Uint8Array.from(atob(p.data),c=>c.charCodeAt(0));
  if(b.length!==m.bytes||await hash(b)!==m.sha256)throw Error('Cartridge integrity check failed. No game code was executed.');bytes.push(b);
 }
 let joined=new Uint8Array(bytes[0].length+bytes[1].length);joined.set(bytes[0]);joined.set(bytes[1],bytes[0].length);
 if(await hash(joined)!==manifest.gzipSHA256)throw Error('The assembled cartridge does not match.');
 let html=await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 if(await hash(new TextEncoder().encode(html))!==manifest.expandedSHA256)throw Error('The expanded game does not match.');
 document.open();document.write(html);document.close();window.STARFALL_ARCHIVE=html;
}
async function read(){if(busy)return;busy=true;status.textContent='Reading and checking both on-chain memories…';try{
 if(!crypto.subtle)throw Error('Use an HTTPS viewer, or open the complete offline HTML edition.');
 const parts=await Promise.all(manifest.parts.map(async(m,i)=>{
  const response=await fetch('https://pool.pm/api/asset/'+m.fingerprint,{signal:AbortSignal.timeout(18000),credentials:'omit',referrerPolicy:'no-referrer'});
  if(!response.ok)throw Error('The chain reader is unavailable. Retry, or load both saved cartridge files.');
  const text=await response.text();if(text.length>100000)throw Error('Unexpected cartridge response.');const data=JSON.parse(text);
  if(data.fingerprint!==m.fingerprint||data.policy!==m.policy)throw Error('The cartridge identity does not match.');
  const src=data.metadata?.files?.[0]?.src;if(!Array.isArray(src))throw Error('Cartridge data is missing.');const uri=src.join('');
  if(!uri.startsWith('data:text/html;charset=utf-8,'))throw Error('Unexpected cartridge format.');
  const html=decodeURIComponent(uri.slice(uri.indexOf(',')+1)),payload=html.match(/<script id="cartridge" type="application\/octet-stream">([A-Za-z0-9+/=]+)<\/script>/);
  if(!payload)throw Error('Cartridge payload is missing.');return {part:i,data:payload[1]};
 }));await assemble(parts);
 }catch(e){status.textContent=e.message||'Could not open the cartridge. Retry or use saved files.';}finally{busy=false;}}
document.getElementById('retry').onclick=read;
document.getElementById('files').onchange=async e=>{if(busy)return;busy=true;try{const files=Array.from(e.target.files);if(files.length!==2||files.some(f=>f.size>30000))throw Error('Select both STARFALL .sfpart files.');await assemble(await Promise.all(files.map(async f=>JSON.parse(await f.text()))));}catch(e){status.textContent=e.message||'Those cartridge files could not load.';}finally{busy=false;}};
read();
})();
</script></html>
