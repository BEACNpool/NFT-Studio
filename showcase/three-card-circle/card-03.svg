<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840"><title>NFT-Studio Circle 03 of 03</title><desc>THE INVITATION. Three distinct programmable business cards. This artwork is static; see the website for confirmed ownership.</desc><rect width="600" height="840" rx="24" fill="#a8e5ee"/><g fill="#17200f" font-family="Arial,Helvetica,sans-serif"><text x="38" y="67" font-size="30" font-weight="900" letter-spacing="-1.5">NFT-STUDIO</text><text x="560" y="65" text-anchor="end" font-family="monospace" font-size="17">03 / 03</text><path d="M38 98H562M38 659H562" stroke="#17200f"/><text x="38" y="131" font-family="monospace" font-size="13" letter-spacing="2">BUILD. MINT. PROGRAM.</text><text x="33" y="249" font-size="97" font-weight="900" letter-spacing="-7">SMALL</text><text x="33" y="340" font-size="97" font-weight="900" letter-spacing="-7">CIRCLE.</text><text x="38" y="390" font-family="monospace" font-size="14" letter-spacing="2">THE INVITATION</text><g fill="none" stroke="#17200f" stroke-width="2"><circle cx="180" cy="527" r="61"/><circle cx="300" cy="527" r="61"/><circle cx="420" cy="527" r="61"/></g><circle cx="420" cy="527" r="48"/><text x="420" y="545" text-anchor="middle" fill="#a8e5ee" font-size="51" font-weight="900">3</text><text x="38" y="704" font-size="17" font-weight="700">COLLECT THE CIRCLE. THEN OPEN IT.</text><text x="38" y="738" font-family="monospace" font-size="12">1 OR 2: SEND TO AN EXISTING HOLDER.</text><text x="38" y="760" font-family="monospace" font-size="12">ALL 3: INVITE SOMEONE NEW.</text><text x="38" y="808" font-family="monospace" font-size="12">BEACNpool / NFT-Studio</text><text x="562" y="808" text-anchor="end" font-family="monospace" font-size="12">CARDANO · CIP-113</text></g></svg>