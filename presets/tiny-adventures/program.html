<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data:;connect-src 'none';form-action 'none';base-uri 'none'"><title>Tiny Adventures</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101314;color:#f1f2ed;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);text-align:center;--a:#f4c882}header{letter-spacing:.18em;font-size:11px;color:var(--a)}h1{font-size:clamp(24px,6vw,36px);line-height:1.15;overflow-wrap:anywhere;margin:18px 0 28px}button,summary{font:inherit;cursor:pointer}button{border:1px solid #46514a;background:transparent;color:inherit;border-radius:30px;min-height:48px;padding:10px 24px}button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:4px}.modes,.actions{display:flex;justify-content:center;gap:8px}.modes button{font-size:14px;min-height:44px;padding:8px 22px}.modes [aria-pressed=true],.primary{background:var(--a);border-color:var(--a);color:#101314}.orb{width:240px;height:240px;margin:28px auto;border:1px solid var(--a);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 10px #ffffff04,0 0 0 30px #ffffff02}.orb span{font-size:54px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.deck{border-radius:32px;transform:rotate(-3deg);padding:24px}.deck span{font-size:28px;line-height:1.15;letter-spacing:-.02em;transform:rotate(3deg);overflow-wrap:anywhere;max-width:100%}#status{color:#c8cdc5;font-size:14px;min-height:42px;margin:0 0 12px}details{margin:24px 0;text-align:left;font-size:14px}summary{color:var(--a)}li{padding:4px;overflow-wrap:anywhere}footer{color:#a7afa7;font-size:11px;margin-top:30px}footer p{margin:5px 0}@media(max-width:340px){body{padding:16px}.orb{width:220px;height:220px}}</style></head><body><main><header>BMKR / DECISION DECK</header><h1>Tiny Adventures</h1><div class="orb deck"><span id="answer" aria-live="polite">What comes next?</span></div><p id="status" role="status">Pick a little possibility.</p><div class="actions"><button id="pick" class="primary">Pick one</button></div><details><summary>Your choices</summary><ol id="choices"></ol></details><footer><p>PUBLIC · REUSABLE · RUNS OFFLINE</p><p>For everyday inspiration. No prizes, voting, or secure draws.</p><p>Session resets on reload. No wallet or network access.</p></footer></main><script>'use strict';const C={"version":1,"kind":"decision","choices":["Take a different path","Sketch what you can see","Ask someone a new question","Make a four-bar groove"],"accent":"#f4c882"},$=id=>document.getElementById(id);let count=0;for(const text of C.choices){const li=document.createElement('li');li.textContent=text;$('choices').append(li)}$('pick').onclick=()=>{if(!globalThis.crypto?.getRandomValues){$('status').textContent='Open in a current browser to pick a choice.';return}const limit=4294967296-4294967296%C.choices.length,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);$('answer').textContent=C.choices[a[0]%C.choices.length];$('status').textContent='Pick '+(++count)+' · You choose what to do with it.';$('pick').textContent='Pick again'};</script></body></html>
