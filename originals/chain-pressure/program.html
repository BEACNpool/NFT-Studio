acing:1px}}</style><main><header><b>BMKR</b><small>BMKR ORIGINAL / 001</small></header><h1>CHAIN<br><span>PRESSURE.</span></h1><p>Heavy 808. Cold hook. No backing down.</p><div class="disc" aria-hidden="true"></div><div class="row"><button id="play">PLAY BEAT</button><button id="stop">STOP</button><button id="dl">WAV ↓</button></div><progress id="progress" value="0" max="20" aria-label="Playback progress"></progress><footer><span>144 BPM / 20 SECONDS</span><span>ORIGINAL INSTRUMENTAL</span></footer><p id="status" role="status">20-second original · generated locally</p></main><script>
function render(sr=44100){
if(!Number.isInteger(sr)||sr<8000||sr>96000)throw Error("sampleRate 8000..96000");

function voice(dst,start,len,fn,gain=1){
let at=Math.round(start*sr),n=Math.min(Math.round(len*sr),N-at);
for(let i=0;i<n;i++){
const t=i/sr,edge=Math.min(1,i/(sr*.0015),(n-1-i)/(sr*.006));

function kick(t,v=1){
voice(drums,t,.38,x=>1.2*sin(T*(48*x+2.8*(1-exp(-x/ .019))))*exp(-x/ .11)+noise()*.22*exp(-x/ .004),v);

for(let i=0;i<sr*.23&&at+i<N;i++)duck[at+i]=Math.max(duck[at+i],exp(-i/sr/.075));
}
function snare(t,v=1){
let z=0;
voice(drums,t,.23,x=>{
const r=noise(),h=r-z;z=r;

function hat(t,v=.6,open=false){
let z=0;
voice(drums,t,open?.2:.07,x=>{
const r=noise(),hp=r-z;z=r;

const kicks=[[0,3,6,10,14],[0,6,7,11,14],[0,5,10,12,15],[0,3,6,10,13,15]];

for(let b=0;b<12;b++){
const t=b*bar,last=b===11,drop=b===7,root=roots[b];
if(last){
kick(t,1.2);snare(t,.55);sub(t,29,1.6,1.05);
bell(t,77,1.05,-.4);bell(t,84,.55,.4);
for(let h=0;h<4;h++)hat(t+h*beat/8,.55-h*.1);
continue;
}
const pattern=kicks[b%4];
for(const s of pattern)if(!drop||s<8)kick(t+s*beat/4,s===0?1.05:.8);
if(!drop){snare(t+2*beat);if(b%4===3)snare(t+3.75*beat,.3);}
else snare(t+beat,.65);
for(let s=0;s<16;s++){
if(drop&&s>=8)continue;
if(b===0&&s%2)continue;
hat(t+s*beat/4,(s%4===0?.85:s%2?.34:.6)*(b>=8?1.1:1));
}
if(!drop){
hat(t+3.5*beat,.5,true);
if(b%2===1||b>=8)for(let j=0;j<6;j++)hat(t+(3.5+j/12)*beat,.35+j*.06);
}
const seq=b%2?[[0,root,1.15],[1.5,root,.55],[2.75,root+7,.4],[3.5,root,.43]]:[[0,root,1.4],[1.75,root,.7],[3,root+12,.65]];
for(const [at,m,len] of seq)if(!drop||at<2)sub(t+at*beat,m,Math.min(len*beat,(drop?2-at:4-at)*beat),.95,b%4===3?m+7:m);

const taps=[.031,.047,.079];
for(let i=N-1;i>=0;i--)for(let k=0;k<3;k++){
const j=i-Math.round(sr*taps[k]);

}

function encodeWav(channels,sampleRate){

text(0,"RIFF");d.setUint32(4,36+size+pad,true);text(8,"WAVEfmt ");d.setUint32(16,16,true);
d.setUint16(20,1,true);d.setUint16(22,c.length,true);d.setUint32(24,sampleRate,true);
d.setUint32(28,sampleRate*block,true);d.setUint16(32,block,true);d.setUint16(34,24,true);
text(36,"data");d.setUint32(40,size,true);
for(let i=0,p=44;i<n;i++)for(const ch of c){
const x=ch[i];if(!Number.isFinite(x)||Math.abs(x)>1)throw Error("Invalid PCM sample");

const $=id=>document.getElementById(id),S=44100;let c,b,s,ch,offset=0,started=0,playing=false,ready=false,url,busy=false;
for(let i=0;i<40;i++){let e=document.createElement('i');e.style.setProperty('--h',(12+(i*73%83))+'%');document.querySelector('.disc').append(e)}
function init(){if(!c)c=new AudioContext({sampleRate:S});if(!ready){ch=render(S);b=c.createBuffer(2,ch.left.length,S);b.copyToChannel(ch.left,0);b.copyToChannel(ch.right,1);ready=true}return c.resume()}
function halt(reset){if(s){s.onended=null;s.stop();s=null}if(playing)offset+=c.currentTime-started;playing=false;if(reset)offset=0;$('play').textContent=offset?'RESUME':'PLAY BEAT'}
